[package]
name = "turnsarsah"
version = "0.1.0"
description = "Turn Sarsah"
authors = ["Turn Sarsah"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
tauri = { version = "2.5.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
